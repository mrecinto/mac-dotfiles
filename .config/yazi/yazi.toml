[opener]

nvim = [
  { run = "$EDITOR %s", block = true, desc = "Neovim" }
]

xournalpp = [
  { run = '"$HOME/.config/yazi/scripts/fix-xopp" %s1 && open -a "Xournal++" %s1', orphan = true, desc = "Xournal++" }
]

preview = [
  { run = 'open -a "Preview" %s', orphan = true, desc = "macOS Preview" }
]


[open]

rules = [
  # Xournal++ — MUST be before inode/x-empty
  { url = "*.xopp", use = "xournalpp" },

  # Empty files
  { mime = "inode/x-empty", use = "nvim" },

  # PDFs — macOS Preview
  { mime = "application/pdf", use = ["preview", "xournalpp"] },
  { url = "*.pdf", use = "preview" },

  # Text files
  { mime = "text/*", use = "nvim" },
  { url = "*.fish", use = "nvim" },
  { url = "*.md", use = "nvim" },

  # Typst
  { mime = "application/x-typst", use = "nvim" },
  { mime = "text/x-typst", use = "nvim" },
  { url = "*.typ", use = "nvim" },

  # Programming/config files
  { url = "*.lua", use = "nvim" },
  { url = "*.cpp", use = "nvim" },
  { url = "*.h", use = "nvim" },
  { url = "*.py", use = "nvim" },
  { url = "*.rs", use = "nvim" },
  { url = "*.json", use = "nvim" },
  { url = "*.toml", use = "nvim" },

  # Final fallback
  { url = "*", use = "nvim" },
]
