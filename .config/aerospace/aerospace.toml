config-version = 2

# Start AeroSpace automatically
start-at-login = true


# ============================================================
# MAIN KEYBINDINGS
# ============================================================

[mode.main.binding]


# ------------------------------------------------------------
# Previous workspace
# Option + Tab
# ------------------------------------------------------------

alt-tab = 'workspace-back-and-forth'
alt-shift-m = 'move-workspace-to-monitor --wrap-around next'

# ------------------------------------------------------------
# Toggle floating
# Option + V
# ------------------------------------------------------------

alt-v = 'layout floating tiling'


# ------------------------------------------------------------
# Focus windows
# Option + H/J/K/L
# Cursor follows keyboard focus
# ------------------------------------------------------------

alt-h = [
    'focus --boundaries all-monitors-outer-frame left',
    'move-mouse window-lazy-center',
]

alt-j = [
    'focus --boundaries all-monitors-outer-frame down',
    'move-mouse window-lazy-center',
]

alt-k = [
    'focus --boundaries all-monitors-outer-frame up',
    'move-mouse window-lazy-center',
]

alt-l = [
    'focus --boundaries all-monitors-outer-frame right',
    'move-mouse window-lazy-center',
]


# ------------------------------------------------------------
# Reorient/rearrange tiled windows
# Option + Shift + H/J/K/L
# ------------------------------------------------------------

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'


# ------------------------------------------------------------
# Move WINDOW between monitors
# Option + Command + Shift + H/L
# ------------------------------------------------------------

alt-cmd-shift-h = 'move-node-to-monitor left'
alt-cmd-shift-l = 'move-node-to-monitor right'


# ------------------------------------------------------------
# Move WORKSPACE between monitors
# Option + Command + H/L
# ------------------------------------------------------------

alt-cmd-h = 'move-workspace-to-monitor left'
alt-cmd-l = 'move-workspace-to-monitor right'


# ============================================================
# NAMED WORKSPACES
# Option + W/A/S/D/I/O
# ============================================================

alt-w = 'workspace W'
alt-a = 'workspace A'
alt-s = 'workspace S'
alt-d = 'workspace D'
alt-i = 'workspace I'
alt-o = 'workspace O'


# ------------------------------------------------------------
# Move window to named workspace
# Option + Shift + W/A/S/D/I/O
# ------------------------------------------------------------

alt-shift-w = 'move-node-to-workspace W'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-i = 'move-node-to-workspace I'
alt-shift-o = 'move-node-to-workspace O'


# ============================================================
# NUMBERED WORKSPACES
# Option + 1-9/0
# 0 = workspace 10
# ============================================================

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'


# ------------------------------------------------------------
# Move window to numbered workspace
# Option + Shift + 1-9/0
# ------------------------------------------------------------

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'
