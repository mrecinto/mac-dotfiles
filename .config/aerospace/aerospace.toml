
config-version = 2

start-at-login = true

# Match Hyprland: gaps_in=6, gaps_out=10.
gaps.inner.horizontal = 6
gaps.inner.vertical = 6
gaps.outer.left = 10
gaps.outer.right = 10
gaps.outer.bottom = 10
# Reserve the 36px SketchyBar plus the same 10px outer gap.
gaps.outer.top = 46

# ============================================================
# CALLBACKS
# ============================================================

# Push workspace changes to the bar immediately.
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change']

# No automatic mouse movement on workspace changes.
on-focused-monitor-changed = []

# ============================================================
# MAIN KEYBINDINGS
# ============================================================

[mode.main.binding]

# ============================================================
# CORE
# ============================================================

alt-q = '''exec-and-forget osascript -e 'tell application "Ghostty" to new window' '''
alt-shift-q = 'close'

alt-v = 'layout floating tiling'

alt-c = 'exec-and-forget python3 ~/.config/aerospace/scripts/zen-window.py'

# ============================================================
# WORKSPACE HISTORY
# ============================================================

# Last special workspace <-> previous workspace
alt-tab = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh toggle-special'

# Previous numbered workspace
alt-backtick = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh previous-numbered'

# Cycle occupied numbered workspaces on this monitor, wrapping at either end.
alt-leftSquareBracket = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/workspace.sh occupied prev'
alt-rightSquareBracket = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/workspace.sh occupied next'


# ============================================================
# MOVE CURRENT WORKSPACE TO NEXT MONITOR
# ============================================================

alt-shift-m = 'move-workspace-to-monitor next --wrap-around'

# ============================================================
# FOCUS WINDOWS
# ============================================================

alt-h = [
    'focus --boundaries all-monitors-outer-frame left',
    'move-mouse window-lazy-center',
]

alt-j = [
    'focus --boundaries all-monitors-outer-frame down',
    'move-mouse window-lazy-center',
]

alt-k = [
    'focus --boundaries all-monitors-outer-frame up',
    'move-mouse window-lazy-center',
]

alt-l = [
    'focus --boundaries all-monitors-outer-frame right',
    'move-mouse window-lazy-center',
]

# ============================================================
# MOVE WINDOWS
# ============================================================

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# ============================================================
# MOVE WINDOW BETWEEN MONITORS
# ============================================================

alt-cmd-shift-h = 'move-node-to-monitor left'
alt-cmd-shift-l = 'move-node-to-monitor right'

# ============================================================
# MOVE WORKSPACE BETWEEN MONITORS
# ============================================================

alt-cmd-h = 'move-workspace-to-monitor left'
alt-cmd-l = 'move-workspace-to-monitor right'

# ============================================================
# SPECIAL WORKSPACES
# ============================================================

alt-w = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special W'
alt-a = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special A'
alt-s = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special S'
alt-d = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special D'
alt-i = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special I'
alt-o = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special O'

# ============================================================
# MOVE WINDOW TO SPECIAL WORKSPACE
# ============================================================

alt-shift-w = 'move-node-to-workspace W'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-i = 'move-node-to-workspace I'
alt-shift-o = 'move-node-to-workspace O'

# ============================================================
# NUMBERED WORKSPACES
# ============================================================

alt-1 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 1'
alt-2 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 2'
alt-3 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 3'
alt-4 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 4'
alt-5 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 5'
alt-6 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 6'
alt-7 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 7'
alt-8 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 8'
alt-9 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 9'
alt-0 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 10'

# ============================================================
# MOVE WINDOW TO NUMBERED WORKSPACE
# ============================================================

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# Move every window in the current workspace and follow the group.
# Existing destination windows stay there; AeroSpace may rearrange the layout.
ctrl-alt-shift-1 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 1'
ctrl-alt-shift-2 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 2'
ctrl-alt-shift-3 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 3'
ctrl-alt-shift-4 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 4'
ctrl-alt-shift-5 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 5'
ctrl-alt-shift-6 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 6'
ctrl-alt-shift-7 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 7'
ctrl-alt-shift-8 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 8'
ctrl-alt-shift-9 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 9'
ctrl-alt-shift-0 = 'exec-and-forget /bin/bash ~/.config/aerospace/scripts/move-workspace-windows.sh 10'
