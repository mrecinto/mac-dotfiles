config-version = 2

start-at-login = true


# ============================================================
# CALLBACKS
# ============================================================

on-focused-monitor-changed = ['move-mouse window-lazy-center']

# Record a workspace ONLY if it is one of our specials:
# W A S D I O
#
# This catches workspace changes from:
# - Option + WASDIO
# - Command + Tab
# - clicking/focusing apps
# - other AeroSpace workspace changes
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '~/.config/aerospace/scripts/record-special.sh "$AEROSPACE_FOCUSED_WORKSPACE"'
]


# ============================================================
# MAIN KEYBINDINGS
# ============================================================

[mode.main.binding]


# ============================================================
# CORE
# ============================================================

alt-q = 'exec-and-forget open -na Ghostty'
alt-shift-q = 'close'

alt-v = 'layout floating tiling'


# ============================================================
# WORKSPACE HISTORY
# ============================================================

# Option + Tab
#
# Normal AeroSpace previous workspace.
#
# Example:
#
# 2 -> D
# Option+Tab -> 2
# Option+Tab -> D
alt-tab = 'workspace-back-and-forth'


# Option + `
#
# Toggle current workspace <-> last SPECIAL workspace.
#
# Example:
#
# 2 -> D -> 4 -> 7
#
# Last special is still D.
#
# Option+` -> D
# Option+` -> 7
alt-backtick = 'exec-and-forget ~/.config/aerospace/scripts/toggle-special.sh'


# ============================================================
# MOVE CURRENT WORKSPACE TO NEXT MONITOR
# ============================================================

alt-shift-m = [
    'move-workspace-to-monitor next --wrap-around',
    'focus-monitor next --wrap-around',
    'move-mouse window-lazy-center',
]


# ============================================================
# FOCUS WINDOWS
# Option + H/J/K/L
# ============================================================

alt-h = [
    'focus --boundaries all-monitors-outer-frame left',
    'move-mouse window-lazy-center',
]

alt-j = [
    'focus --boundaries all-monitors-outer-frame down',
    'move-mouse window-lazy-center',
]

alt-k = [
    'focus --boundaries all-monitors-outer-frame up',
    'move-mouse window-lazy-center',
]

alt-l = [
    'focus --boundaries all-monitors-outer-frame right',
    'move-mouse window-lazy-center',
]


# ============================================================
# MOVE WINDOWS
# Option + Shift + H/J/K/L
# ============================================================

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'


# ============================================================
# MOVE WINDOW BETWEEN MONITORS
# ============================================================

alt-cmd-shift-h = 'move-node-to-monitor left'
alt-cmd-shift-l = 'move-node-to-monitor right'


# ============================================================
# MOVE WORKSPACE BETWEEN MONITORS
# ============================================================

alt-cmd-h = 'move-workspace-to-monitor left'
alt-cmd-l = 'move-workspace-to-monitor right'


# ============================================================
# SPECIAL WORKSPACES
# Option + W/A/S/D/I/O
# ============================================================

alt-w = 'workspace W'
alt-a = 'workspace A'
alt-s = 'workspace S'
alt-d = 'workspace D'
alt-i = 'workspace I'
alt-o = 'workspace O'


# ============================================================
# MOVE WINDOW TO SPECIAL WORKSPACE
# ============================================================

alt-shift-w = 'move-node-to-workspace W'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-i = 'move-node-to-workspace I'
alt-shift-o = 'move-node-to-workspace O'


# ============================================================
# NUMBERED WORKSPACES
# ============================================================

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'


# ============================================================
# MOVE WINDOW TO NUMBERED WORKSPACE
# ============================================================

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'
