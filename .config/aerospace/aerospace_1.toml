config-version = 2

start-at-login = true


# ============================================================
# CALLBACKS
# ============================================================

on-focused-monitor-changed = ['move-mouse window-lazy-center']


# ============================================================
# MAIN KEYBINDINGS
# ============================================================

[mode.main.binding]


# ============================================================
# CORE
# ============================================================

# Open new Ghostty window
alt-q = '''exec-and-forget osascript -e 'tell application "Ghostty" to new window' '''

# Close current window
alt-shift-q = 'close'

# Toggle floating / tiling
alt-v = 'layout floating tiling'

# Open new Zen window
alt-c = 'exec-and-forget open -na "Zen"'


# ============================================================
# WORKSPACE HISTORY
#
# Option + Tab = last SPECIAL workspace
# Option + `   = previous NUMBERED workspace
# ============================================================


# ------------------------------------------------------------
# Option + Tab
#
# Toggle current workspace <-> last SPECIAL workspace.
#
# Example:
#
# 2 -> D -> 4 -> W -> 7
#
# Option+Tab -> W
# Option+Tab -> 7
# Option+Tab -> W
# ------------------------------------------------------------

alt-tab = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh toggle-special'


# ------------------------------------------------------------
# Option + `
#
# Toggle between the two most recently used NUMBERED
# workspaces.
#
# Special workspaces are ignored.
#
# Example:
#
# 2 -> 4 -> D -> W -> 7
#
# Option+` -> 4
# Option+` -> 7
# Option+` -> 4
# ------------------------------------------------------------

alt-backtick = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh previous-numbered'


# ============================================================
# MOVE CURRENT WORKSPACE TO NEXT MONITOR
# ============================================================

# alt-shift-m = [
#     'move-workspace-to-monitor next --wrap-around',
#     'focus-monitor next --wrap-around',
#     'move-mouse window-lazy-center',
# ]

alt-shift-m = [
    'move-workspace-to-monitor next --wrap-around',
    'move-mouse window-lazy-center',
]

# ============================================================
# FOCUS WINDOWS
# Option + H/J/K/L
# ============================================================

alt-h = [
    'focus --boundaries all-monitors-outer-frame left',
    'move-mouse window-lazy-center',
]

alt-j = [
    'focus --boundaries all-monitors-outer-frame down',
    'move-mouse window-lazy-center',
]

alt-k = [
    'focus --boundaries all-monitors-outer-frame up',
    'move-mouse window-lazy-center',
]

alt-l = [
    'focus --boundaries all-monitors-outer-frame right',
    'move-mouse window-lazy-center',
]


# ============================================================
# MOVE WINDOWS
# Option + Shift + H/J/K/L
# ============================================================

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'


# ============================================================
# MOVE WINDOW BETWEEN MONITORS
# ============================================================

alt-cmd-shift-h = 'move-node-to-monitor left'
alt-cmd-shift-l = 'move-node-to-monitor right'


# ============================================================
# MOVE WORKSPACE BETWEEN MONITORS
# ============================================================

alt-cmd-h = 'move-workspace-to-monitor left'
alt-cmd-l = 'move-workspace-to-monitor right'


# ============================================================
# SPECIAL WORKSPACES
# Option + W/A/S/D/I/O
#
# These update SPECIAL history only.
# They do NOT modify numbered history.
# ============================================================

alt-w = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special W'
alt-a = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special A'
alt-s = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special S'
alt-d = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special D'
alt-i = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special I'
alt-o = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh special O'


# ============================================================
# MOVE WINDOW TO SPECIAL WORKSPACE
# Option + Shift + W/A/S/D/I/O
# ============================================================

alt-shift-w = 'move-node-to-workspace W'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-i = 'move-node-to-workspace I'
alt-shift-o = 'move-node-to-workspace O'


# ============================================================
# NUMBERED WORKSPACES
# Option + 1-0
#
# These update NUMBERED history only.
# ============================================================

alt-1 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 1'
alt-2 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 2'
alt-3 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 3'
alt-4 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 4'
alt-5 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 5'
alt-6 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 6'
alt-7 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 7'
alt-8 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 8'
alt-9 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 9'
alt-0 = 'exec-and-forget ~/.config/aerospace/scripts/workspace.sh numbered 10'


# ============================================================
# MOVE WINDOW TO NUMBERED WORKSPACE
# Option + Shift + 1-0
# ============================================================

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'
