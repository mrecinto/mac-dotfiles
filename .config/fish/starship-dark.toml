# Dark appearance variant of ../starship.toml. Keep the layout in sync.
add_newline = true
palette = "pastel"
format = """
[](fg:slate)\
$username\
[](fg:slate bg:peach)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:cyan)\
$cmd_duration\
[](fg:cyan bg:pink)\
$time\
[](fg:pink)\
$line_break\
$character"""

[palettes.pastel]
slate = "#45475a"
text = "#cdd6f4"
ink = "#1e1e2e"
peach = "#fab387"
green = "#a6e3a1"
cyan = "#89dceb"
pink = "#f5c2e7"
red = "#f38ba8"

[username]
show_always = true
style_user = "fg:text bg:slate"
style_root = "fg:red bg:slate bold"
format = "[ $user ]($style)"

[directory]
style = "fg:ink bg:peach bold"
format = "[ $path$read_only ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
style = "fg:ink bg:green"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:ink bg:green"
format = "[($all_status$ahead_behind )]($style)"
conflicted = "~${count} "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↑${ahead_count}↓${behind_count} "
untracked = "?${count} "
stashed = "≡${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[cmd_duration]
min_time = 2000
style = "fg:ink bg:cyan"
format = "[ $duration ]($style)"

[time]
disabled = false
time_format = "%I:%M %p"
style = "fg:ink bg:pink"
format = "[  $time ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold pink)"
