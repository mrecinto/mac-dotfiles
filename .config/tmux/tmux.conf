# ============================================================
# GENERAL
# ============================================================

# Mouse support
set -g mouse on

# Faster escape time for Neovim
set -sg escape-time 10

# Scrollback history
set -g history-limit 10000

# Better terminal colors
set -g default-terminal "tmux-256color"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on


# ============================================================
# STATUS / MESSAGES
# ============================================================

set -g status-style fg=default,bg=default
set -g message-style fg=default,bg=default


# ============================================================
# COPY MODE
# ============================================================

setw -g mode-keys vi
set -g mode-style fg=default,bg=colour4


# ============================================================
# RELOAD CONFIG
#
# Ctrl+B, then R
# ============================================================

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"


# ============================================================
# WINDOWS / TABS
# ============================================================

# Ctrl+T → new tab
bind -n C-t new-window -c "#{pane_current_path}"

# Ctrl+W → close current tab
# bind -n C-w kill-window


# ============================================================
# TAB CYCLING
# ============================================================

# Ctrl+[ → previous tab
bind -n 'C-[' previous-window

# Ctrl+] → next tab
bind -n 'C-]' next-window


# ============================================================
# CTRL + NUMBER
#
# Ghostty converts:
#
# Ctrl+1 → Ctrl+B, then 1
# Ctrl+2 → Ctrl+B, then 2
# ...
# Ctrl+9 → Ctrl+B, then 9
#
# No special tmux bindings are needed.
# ============================================================


# ============================================================
# PANE NAVIGATION
#
# Ctrl+H/J/K/L
# ============================================================

# Left
bind -n C-h select-pane -L

# Down
bind -n C-j select-pane -D

# Up
bind -n C-k select-pane -U

# Right
bind -n C-l select-pane -R


# ============================================================
# PANE CREATION
# ============================================================

# Ctrl+V → side-by-side split
#
# ┌────────┬────────┐
# │        │        │
# │        │        │
# └────────┴────────┘

bind -n C-v split-window -h -c "#{pane_current_path}"


# Ctrl+S → top/bottom split
#
# ┌─────────────────┐
# │                 │
# ├─────────────────┤
# │                 │
# └─────────────────┘

bind -n C-s split-window -v -c "#{pane_current_path}"


# ============================================================
# PANE MANAGEMENT
# ============================================================

# Ctrl+Z → zoom / unzoom
bind -n C-z resize-pane -Z


# ============================================================
# PREFIX FALLBACKS
#
# Prefix = Ctrl+B
# ============================================================

# Previous tab
bind h previous-window

# Next tab
bind l next-window

# New tab
bind c new-window -c "#{pane_current_path}"

# Rename tab
bind , command-prompt -p "rename window:" "rename-window '%%'"


# ============================================================
# SESSION PICKER
#
# Ctrl+B, then Shift+S
# ============================================================

bind S choose-tree -Zs
